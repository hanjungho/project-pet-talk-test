<!DOCTYPE html>

<body>
    <header id="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">펫톡</a>

            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html">홈</a></li>

            </nav>
        </div>

    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-card">

                    <p class="auth-subtitle">소셜 계정으로 간편하게 로그인하세요.</p>
                    
                    <div class="social-login-btns">
                        <button id="kakao-login-btn" class="social-btn kakao">
                            <img src="/api/placeholder/20/20" alt="카카오 로고">
                            카카오로 로그인
                        </button>
                        <button id="naver-login-btn" class="social-btn naver">
                            <img src="/api/placeholder/20/20" alt="네이버 로고">
                            네이버로 로그인
                        </button>
                    </div>
                    
                    <div class="auth-divider">
                        <span>또는</span>
                    </div>
                    
                    <p>아직 회원이 아니신가요?</p>
                    <a href="register.html" class="btn secondary full-width">회원가입</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <h3>펫톡</h3>
                    <p>반려동물과 함께하는 행복한 일상</p>

                <div class="footer-links">

                    <p>이메일: info@pettalk.kr</p>
                    <p>전화: 02-123-4567</p>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
