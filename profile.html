<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필 - 펫톡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <header id="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">펫톡</a>
            </div>
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="trainers.html">훈련사 찾기</a></li>
                    <li><a href="community.html">커뮤니티</a></li>
                    <li id="login-menu" style="display: none;"><a href="login.html">로그인</a></li>
                    <li id="profile-menu"><a href="profile.html">내 프로필</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="profile-section">
            <div class="container">
                <div class="profile-header">
                    <div class="profile-image">
                        <img id="user-profile-image" src="/api/placeholder/150/150" alt="프로필 이미지">
                        <div class="edit-icon" id="edit-profile-image">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    <div class="profile-info">
                        <h1 id="user-nickname">사용자 닉네임</h1>
                        <p id="user-email">user@example.com</p>
                    </div>
                </div>

                <div class="profile-tabs">
                    <button class="tab-btn active" data-tab="profile-edit">프로필 수정</button>
                    <button class="tab-btn" data-tab="my-applications">내 신청 내역</button>
                    <button class="tab-btn" data-tab="my-reviews">내 후기</button>
                </div>

                <div class="tab-content" id="profile-edit">
                    <div class="profile-card">
                        <h2>프로필 수정</h2>
                        <form id="profile-edit-form">
                            <div class="form-group">
                                <label for="edit-nickname">닉네임</label>
                                <input type="text" id="edit-nickname" name="nickname">
                            </div>
                            <div class="form-group">
                                <label for="edit-profile-image-upload">프로필 이미지</label>
                                <input type="file" id="edit-profile-image-upload" accept="image/*">
                                <input type="hidden" id="edit-profile-image-url" name="profileImageUrl">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn primary">저장하기</button>
                            </div>
                        </form>
                    </div>

                    <div class="profile-card">
                        <h2>계정 관리</h2>
                        <div class="account-actions">
                            <button id="logout-btn" class="btn secondary">
                                <i class="fas fa-sign-out-alt"></i> 로그아웃
                            </button>
                            <button id="withdraw-btn" class="btn danger">
                                <i class="fas fa-user-times"></i> 회원 탈퇴
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="my-applications" style="display: none;">
                    <div class="profile-card">
                        <h2>내 훈련사 신청 내역</h2>
                        <div id="applications-list" class="list-container">
                            <!-- 신청 목록이 여기에 동적으로 추가됩니다 -->
                            <div class="empty-list-message">신청 내역이 없습니다.</div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="my-reviews" style="display: none;">
                    <div class="profile-card">
                        <h2>내가 작성한 후기</h2>
                        <div id="reviews-list" class="list-container">
                            <!-- 후기 목록이 여기에 동적으로 추가됩니다 -->
                            <div class="empty-list-message">작성한 후기가 없습니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <h3>펫톡</h3>
                    <p>반려동물과 함께하는 행복한 일상</p>
                </div>
                <div class="footer-links">
                    <h4>바로가기</h4>
                    <ul>
                        <li><a href="about.html">소개</a></li>
                        <li><a href="trainers.html">훈련사 찾기</a></li>
                        <li><a href="community.html">커뮤니티</a></li>
                        <li><a href="faq.html">자주 묻는 질문</a></li>
                    </ul>
                </div>
                <div class="footer-contact">
                    <h4>문의하기</h4>
                    <p>이메일: info@pettalk.kr</p>
                    <p>전화: 02-123-4567</p>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 펫톡. 모든 권리 보유.</p>
            </div>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
