<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>펫톡 - 리다이렉트 중...</title>
    <script>
        // URL에서 토큰 파라미터 추출
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // 현재 URL에서 기본 경로 추출
        const baseUrl = window.location.href.split('/register')[0];
        
        // 메인 페이지로 리다이렉트하면서 토큰 전달
        // 기본 경로를 유지하여 프로젝트 경로가 포함되도록 함
        window.location.href = baseUrl + '/?token=' + token;
    </script>
</head>
<body>
    <p>잠시만 기다려주세요. 리다이렉트 중입니다...</p>
</body>
</html>
