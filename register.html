<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>펫톡 - 리다이렉트 중...</title>
    <script>
        // URL에서 토큰 파라미터 추출
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // 현재 URL에서 경로 추출 (GitHub Pages 경로 유지)
        const baseUrl = window.location.href.split('/register')[0];
        
        // 메인 페이지로 리다이렉트하면서 토큰 전달
        window.location.href = baseUrl + '/?token=' + token;
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4a6baf;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-right: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        p {
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>잠시만 기다려주세요. 리다이렉트 중입니다...</p>
</body>
</html>
