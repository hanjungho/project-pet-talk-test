<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>훈련사 찾기 - 펫톡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/trainers.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <header id="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">펫톡</a>
            </div>
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html">홈</a></li>
                    <li><a href="trainers.html">훈련사 찾기</a></li>
                    <li><a href="community.html">커뮤니티</a></li>
                    <li id="login-menu"><a href="login.html">로그인</a></li>
                    <li id="profile-menu" style="display: none;"><a href="profile.html">내 프로필</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="trainer-search-section">
            <div class="container">
                <h1>전문 훈련사 찾기</h1>
                <p>반려동물의 행동 문제를 전문적으로 상담해드립니다.</p>
                
                <div class="search-filters">
                    <div class="filter-group">
                        <label for="specialization">전문 분야</label>
                        <select id="specialization">
                            <option value="">모든 분야</option>
                            <option value="기본훈련">기본훈련</option>
                            <option value="공격성">공격성</option>
                            <option value="분리불안">분리불안</option>
                            <option value="사회화">사회화</option>
                            <option value="배변훈련">배변훈련</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="rating">평점</label>
                        <select id="rating">
                            <option value="">모든 평점</option>
                            <option value="5">5점</option>
                            <option value="4">4점 이상</option>
                            <option value="3">3점 이상</option>
                        </select>
                    </div>
                    <button id="search-btn" class="btn primary">검색</button>
                </div>
                
                <div id="trainers-list" class="trainers-grid">
                    <!-- 훈련사 목록이 여기에 동적으로 추가됩니다 -->
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>훈련사 정보를 불러오는 중...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <h3>펫톡</h3>
                    <p>반려동물과 함께하는 행복한 일상</p>
                </div>
                <div class="footer-links">
                    <h4>바로가기</h4>
                    <ul>
                        <li><a href="about.html">소개</a></li>
                        <li><a href="trainers.html">훈련사 찾기</a></li>
                        <li><a href="community.html">커뮤니티</a></li>
                        <li><a href="faq.html">자주 묻는 질문</a></li>
                    </ul>
                </div>
                <div class="footer-contact">
                    <h4>문의하기</h4>
                    <p>이메일: info@pettalk.kr</p>
                    <p>전화: 02-123-4567</p>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 펫톡. 모든 권리 보유.</p>
            </div>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/trainers.js"></script>
</body>
</html>
